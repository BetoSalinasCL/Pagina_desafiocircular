# preview.desafiocircular.org — protegido con clave. Gestionado desde el repo (infra/nginx).
server {
    listen 80; listen [::]:80;
    server_name preview.desafiocircular.org;
    location /.well-known/acme-challenge/ { root /srv/desafiocircular/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name preview.desafiocircular.org;
    ssl_certificate     /etc/letsencrypt/live/preview.desafiocircular.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.desafiocircular.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    auth_basic "Preview Desafio Circular";
    auth_basic_user_file /srv/desafiocircular/infra/nginx/.htpasswd;

    root /srv/desafiocircular/www/preview;
    index index.html;
    location / { try_files $uri $uri/ $uri.html =404; }
}
